aid: smartmind
name: SmartMind
description: >-
  SmartMind AI Inc. is a South Korean AI company (Techstars 2020, Seoul) building
  ontology-based enterprise AI. Its current products are Qurify — a natural-language data
  analysis platform that answers questions without SQL by combining structured databases
  and unstructured documents through a TAG+RAG hybrid architecture and a 2-tier ontology —
  and AI-Minwon, a government/public-administration application built on Qurify. SmartMind's
  earlier product, ThanoSQL, is an analytical relational database with a built-in LLM/DL/ML
  query layer, exposed through a REST API (OpenAPI 3.0.2, 34 operations across query, table,
  schema, view, template, file-manager, health, and metric resources) and an official Python
  SDK (pypi:thanosql). This profile captures the still-published ThanoSQL developer surface;
  the hosted ThanoSQL documentation has been decommissioned.
